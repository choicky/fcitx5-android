name: Release APK

# Builds a signed release APK against the MoQi auxiliary filter branch and
# publishes it as a GitHub release. Triggered by pushing a version tag.
#
# Signing comes from the repo secrets SIGN_KEY_BASE64 / SIGN_KEY_PWD /
# SIGN_KEY_ALIAS: the build-logic convention plugin turns SIGN_KEY_BASE64 into
# a keystore file and creates the "release" signing config from it, so no
# signing code lives in this fork.
#
# The release variant carries applicationIdSuffix ".fusionenhanced", so these
# builds can be installed next to the official Fcitx5 and updated in place.

on:
  push:
    tags:
      - "v*"

# Pinned for reproducibility: rebuilding a tag must use exactly this commit of
# fcitx5-chinese-addons, not whatever the branch points at by then. The commit
# and the MoQi table hash are recorded in the release notes by this workflow.
env:
  ADDON_COMMIT: 47401b04681615024e4cf87c4797005b26e202ff

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out the pinned MoQi auxiliary filter commit
        run: |
          cd lib/fcitx5-chinese-addons/src/main/cpp/fcitx5-chinese-addons
          url=https://github.com/choicky/fcitx5-chinese-addons.git
          git fetch --depth 1 "$url" "$ADDON_COMMIT"
          git checkout --detach "$ADDON_COMMIT"
          test "$(git rev-parse HEAD)" = "$ADDON_COMMIT"
          echo "addon commit checked out: $(git rev-parse HEAD)"
          grep -q "AuxiliaryFilter" im/pinyin/pinyin.h

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Install CMake
        run: sdkmanager --install "cmake;3.31.6"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build signed release APK (arm64-v8a)
        env:
          SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
        run: BUILD_ABI=arm64-v8a ./gradlew :app:assembleRelease

      - name: Verify the release APK is signed, fusionenhanced and packs the MoQi table
        run: |
          set -euo pipefail
          mkdir -p fcitx5-android-fusion-enhanced-release
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          test "${#apks[@]}" = 1
          apk=${apks[0]}
          original=${apk##*/}
          input_prefix=org.fcitx.fcitx5.android-
          target_prefix=org.fcitx.fcitx5.android.fusion-enhanced-
          case "$original" in "$input_prefix"*) ;; *) echo "unexpected Gradle APK prefix: $original"; exit 1 ;; esac
          version=${original#"$input_prefix"}
          case "$version" in *.apk) ;; *) echo "unexpected Gradle APK version suffix: $version"; exit 1 ;; esac
          expected_version="$version"
          renamed="$target_prefix$expected_version"
          digest=$(sha256sum "$apk" | cut -d' ' -f1)
          mv "$apk" "fcitx5-android-fusion-enhanced-release/$renamed"
          test "$digest" = "$(sha256sum "fcitx5-android-fusion-enhanced-release/$renamed" | cut -d' ' -f1)"
          case "$renamed" in "$target_prefix"*) ;; *) echo "renamed APK prefix changed: $renamed"; exit 1 ;; esac
          test "${renamed#"$target_prefix"}" = "$expected_version"
          test -f "fcitx5-android-fusion-enhanced-release/$renamed"
          pin_file=lib/fcitx5-chinese-addons/src/main/cpp/fcitx5-chinese-addons/modules/pinyinhelper/moqima-gb18030.cmake
          pinned=$(grep -oE '[0-9a-f]{64}' "$pin_file")
          echo "pinned table sha256 (from the addon pin file): $pinned"
          python3 - "$pinned" <<'PY'
          import glob
          import hashlib
          import sys
          import zipfile

          PINNED = sys.argv[1]
          TABLE = "assets/usr/share/fcitx5/pinyinhelper/moqima_gb18030.txt"
          apks = glob.glob("fcitx5-android-fusion-enhanced-release/*.apk")
          assert len(apks) == 1, f"expected exactly one release APK, found {len(apks)}"
          print("release APK:", apks[0])
          with zipfile.ZipFile(apks[0]) as zf:
              names = zf.namelist()
              assert TABLE in names, f"MoQi table missing: {TABLE}"
              digest = hashlib.sha256(zf.read(TABLE)).hexdigest()
              print("packed table sha256:", digest)
              assert digest == PINNED, "packed table does not match the pinned hash"
              sigs = [n for n in names if n.startswith("META-INF/") and n.endswith((".RSA", ".EC", ".DSA"))]
              print("v1 signature entries:", sigs)
              assert sigs, "APK does not look signed"
              manifest = zf.read("AndroidManifest.xml")
              assert "org.fcitx.fcitx5.android.fusionenhanced".encode("utf-16-le") in manifest, (
                  "release APK does not carry the fusionenhanced package id"
              )
          print("release APK checks passed")
          PY

      - name: Record the pinned commits and table hash in the release notes
        run: |
          addon=$(git -C lib/fcitx5-chinese-addons/src/main/cpp/fcitx5-chinese-addons rev-parse HEAD)
          pin_file=lib/fcitx5-chinese-addons/src/main/cpp/fcitx5-chinese-addons/modules/pinyinhelper/moqima-gb18030.cmake
          table=$(grep -oE '[0-9a-f]{64}' "$pin_file")
          apk=$(find fcitx5-android-fusion-enhanced-release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          apk_name=${apk##*/}
          apk_sha256=$(sha256sum "$apk" | cut -d' ' -f1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f -print -quit)
          test -n "$apksigner"
          cert=$($apksigner verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          test -n "$cert"
          {
            echo ""
            echo "## 可追溯性"
            echo ""
            echo "- fcitx5-chinese-addons：\`$addon\`"
            echo "- MoQi 码表 SHA256：\`$table\`"
            echo "- fcitx5-android：\`$GITHUB_SHA\`（tag \`$GITHUB_REF_NAME\`）"
            echo "- APK 文件名：\`$apk_name\`"
            echo "- APK SHA256：\`$apk_sha256\`"
            echo "- APK signing certificate SHA-256：\`$cert\`"
            echo ""
            echo "本构建固定 addon commit；源码含 Auxiliary Filter 翻译，APK 资源由该固定 addon 构建，真机中文显示需另行验收。"
          } >> .github/moqi-release-notes.md
          tail -8 .github/moqi-release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" fcitx5-android-fusion-enhanced-release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "fcitx5-android-fusion-enhanced $tag" \
            --notes-file .github/moqi-release-notes.md \
            --verify-tag
