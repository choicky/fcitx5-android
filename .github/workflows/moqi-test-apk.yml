name: MoQi test APK

# Builds an installable debug APK of fcitx5-android against
# choicky/fcitx5-chinese-addons@feature/moqi-filter, so that the Auxiliary
# Filter configuration (Disabled / Stroke / MoQi) can be verified on a real
# device. The debug build gets its own applicationId suffix, so it can be
# installed next to the official fcitx5-android build. Only arm64-v8a is
# built to keep the job short.

on:
  push:
    branches:
      - moqi-test-apk
  workflow_dispatch:

concurrency:
  group: moqi-test-apk
  cancel-in-progress: true

jobs:
  build_debug_apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Use the MoQi auxiliary filter branch
        run: |
          cd lib/fcitx5-chinese-addons/src/main/cpp/fcitx5-chinese-addons
          git fetch --depth 1 https://github.com/choicky/fcitx5-chinese-addons.git feature/moqi-filter
          git checkout --detach FETCH_HEAD
          git log --oneline -1
          grep -q "AuxiliaryFilter" im/pinyin/pinyin.h
          grep -q "AuxiliaryFilter" test/testpinyin.cpp

      - name: Stage the MoQi table as Android prebuilt assets
        # The app only installs the prebuilt-assets / config / translation
        # CMake components, so the table that fcitx5-chinese-addons installs
        # for desktop builds never reaches the APK. Put the pinned table
        # where app/src/main/cpp/CMakeLists.txt picks up pinyinhelper data.
        run: |
          set -euo pipefail
          target="lib/fcitx5/src/main/cpp/prebuilt/chinese-addons-data/pinyinhelper/moqima_gb18030.txt"
          curl -fsSL "https://raw.githubusercontent.com/gaboolic/moqima-tables/6d8ba8f1c57466f358e682baefe11bbd0fe389ab/moqima_gb18030.txt" -o "$target"
          echo "66deab4aaba1285e3c85eb3a364c21bc08db1911b61df8e934f0d006ca7e7923  $target" | sha256sum -c -
          ls -l "$target"

      - name: Give the debug build its own package id
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          path = pathlib.Path("app/build.gradle.kts")
          source = path.read_text()
          if "applicationIdSuffix" in source:
              print("already patched")
              sys.exit(0)
          anchor = "        debug {\n"
          if anchor not in source:
              sys.exit("debug build type not found in app/build.gradle.kts")
          source = source.replace(
              anchor, anchor + '            applicationIdSuffix = ".debug"\n', 1
          )
          path.write_text(source)
          print("patched applicationIdSuffix")
          PY
          grep -n "applicationIdSuffix" app/build.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Install CMake
        run: sdkmanager --install "cmake;3.31.6"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK (arm64-v8a)
        run: BUILD_ABI=arm64-v8a ./gradlew :app:assembleDebug

      - name: Report APK
        run: ls -l app/build/outputs/apk/debug/

      - name: Verify the APK packs the MoQi table and the filter code
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          apks = glob.glob("app/build/outputs/apk/debug/*.apk")
          assert apks, "no APK found"
          with zipfile.ZipFile(apks[0]) as zf:
              names = zf.namelist()
              table = [n for n in names if "moqima" in n]
              print("MoQi table entries:", table)
              assert table, "MoQi table missing from APK assets"
              pinyin = zf.read("lib/arm64-v8a/libpinyin.so")
              assert b"AuxiliaryFilter" in pinyin or b"A\x00u\x00x\x00i\x00l\x00i\x00a\x00r\x00y" in pinyin, (
                  "libpinyin.so does not look like the auxiliary filter build"
              )
              manifest = zf.read("AndroidManifest.xml")
              assert "org.fcitx.fcitx5.android.debug".encode("utf-16-le") in manifest, (
                  "APK does not carry the .debug package id"
              )
          print("APK content checks passed")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: moqi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
